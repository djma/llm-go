[project]
name = "goqueen"
version = "0.1.0"
description = "Language models that play Go and explain their moves (a Go port of Queen)"
readme = "README.md"
authors = [
    { name = "David Ma", email = "ma.davidj@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
